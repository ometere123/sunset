name: sunset-verified-contract
on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline preflight
        run: python3 scripts/preflight.py
      - name: Compile contract and tests
        run: python3 -m compileall -q contracts scripts tests
      - name: Offline adversarial state-machine tests
        run: python3 -B -m unittest discover -s tests -p test_offline.py -v
      - name: Source digests
        run: python3 scripts/source_hashes.py

  genvm:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.2.12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Direct Mode and GenVM tooling
        run: python3 -m pip install -r requirements-dev.txt
      - name: Lint and validate both contract schemas
        run: |
          genvm-lint check contracts/sunset.py
          genvm-lint check contracts/sunset_gate.py
          genvm-lint schema contracts/sunset.py
          genvm-lint schema contracts/sunset_gate.py
      - name: Official GenLayer Direct Mode
        run: python3 -m pytest -q tests/direct

  pinned-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify exact local CLI version
        run: node -e "if(require('./node_modules/genlayer/package.json').version!=='0.39.1')process.exit(1)"
      - run: node --check scripts/guarded-deploy.mjs
